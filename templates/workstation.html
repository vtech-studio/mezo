<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>Mezô · {{.Title}} · {{.Name}}</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/workstation.css"><script src="/workstation.js" defer></script></head>
<body data-slug="{{.Slug}}" data-view="{{.View}}"><div class="workspace"><header class="topbar"><a class="brand" href="/"><img class="mezo-logo" src="/mezo-logo.png" alt="Mezô" width="130" height="43"><span>À SUA MESA</span></a><div class="place"><strong>{{.Name}}</strong><span>{{.Title}}</span></div><button class="icon-button" id="account-button" aria-label="Minha conta" hidden>☰</button></header><p id="connection" class="connection" role="status">Conectando à casa…</p><main id="content" tabindex="-1"></main><nav id="navigation" aria-label="Navegação da equipe"></nav><footer class="footnote">mezô · um cuidado de cada vez.</footer></div>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button class="icon-button" id="close-drawer" aria-label="Fechar">×</button></div><div id="drawer-body"></div></dialog><div id="toast" role="status" class="toast" hidden></div>
</body></html>
