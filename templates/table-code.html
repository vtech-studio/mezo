<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mezô · código da mesa</title><link rel="icon" href="{{asset "favicon.svg"}}"><link rel="stylesheet" href="{{asset "admin.css"}}"></head><body><main class="portal"><a class="brand" href="/"><img class="mezo-logo" src="{{asset "mezo-logo.png"}}" alt="Mezô" width="130" height="43"><span>À SUA MESA</span></a>{{if .Name}}<p class="eyebrow">{{.Name}}</p>{{end}}<h1>Quase lá.<br><em>Qual é o código?</em></h1><p>Peça à equipe o código de 4 dígitos desta mesa. Ele confirma que você está no restaurante. Quem já entrou na mesa também vê o código no celular.</p><section class="panel"><form method="post" action="{{.Action}}"><label>Código da mesa<input name="code" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="one-time-code" required autofocus></label><button class="button">Entrar na mesa →</button>{{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}</form></section></main></body></html>
