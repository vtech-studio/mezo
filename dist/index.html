<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="À mesa da Casa do Sol: consulte o cardápio, chame o garçom e acompanhe sua conta pelo celular.">
  <title>Mezô · à sua mesa</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/backend.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="restaurant" href="#mesa" aria-label="Casa do Sol, início">
        <span class="restaurant-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="9"/><path d="M24 3v7m0 28v7M3 24h7m28 0h7M9.2 9.2l5 5m19.6 19.6 5 5M9.2 38.8l5-5m19.6-19.6 5-5M16 4.6l2.7 6.4m10.6 26 2.7 6.4M4.6 32l6.4-2.7m26-10.6 6.4-2.7M4.6 16l6.4 2.7m26 10.6 6.4 2.7M16 43.4l2.7-6.4m10.6-26L32 4.6"/></svg></span>
        <span>Casa do Sol<small>À SUA MESA COM MEZÔ</small></span>
      </a>
      <button class="icon-button" id="more-button" aria-label="Informações e opções"><span data-icon="more"></span></button>
    </header>
    <div class="view-selector" aria-label="Área de atendimento">
      <div class="role-switch" role="group" aria-label="Escolher visão">
        <button data-role="customer" aria-pressed="true">Cliente</button>
        <button data-role="waiter" aria-pressed="false">Garçom</button>
      </div>
      <span class="live-label"><span></span> Tudo a seu tempo</span>
    </div>
    <p class="preview-note">Prévia do Mezô · dados de exemplo</p>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal"></nav>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p>Ative o JavaScript para experimentar as interações desta interface.</p></noscript>
</body>
</html>
